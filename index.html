<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1917" />
  <meta name="description" content="A small, living ASCII meadow. Watch sheep graze, scatter a little feed, and guide your sheepdog through the grass." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" href="/fonts/geist-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <title>ASCII Meadow — the grass is greener here</title>
</head>
<body>
  <canvas id="meadow" tabindex="0" aria-label="Living ASCII meadow. Left-click to move the sheepdog. Right-click to feed. Space toggles the regrow brush. Q bark, W circle every sheep, E sprint. R recall to the pen; R again sprints to the cursor. No cooldowns."></canvas>
  <button id="settings-toggle" aria-label="Meadow settings" aria-expanded="false" aria-controls="settings-panel"><span aria-hidden="true">[*]</span></button>
  <section id="settings-panel" role="dialog" aria-label="Meadow controls" tabindex="-1" hidden>
    <section class="flock-controls" aria-label="Flock size">
      <div class="flock-heading"><h2>flock size</h2><span id="flock-caption">3 lambs</span></div>
      <div class="counter-row"><button id="remove-sheep" aria-label="Remove a sheep">[-]</button><span class="sheep-count"><output id="sheep-count">18</output> sheep</span><button id="add-sheep" aria-label="Add a sheep">[+]</button></div>
    </section>
    <section class="settings-section action-grid" aria-label="Meadow tools">
      <button id="feed-button" aria-label="Place feed" aria-pressed="false">[ feed ]</button>
      <button id="regrow-button" aria-label="Regrow grass brush" aria-pressed="false">[ grow ]</button>
      <button id="pause" aria-label="Pause meadow" aria-pressed="false">[ pause ]</button>
      <button id="reset" aria-label="Start a fresh meadow">[ start again ]</button>
    </section>
    <section id="help" class="settings-section" aria-label="How to play">
      <h2>how to play</h2>
      <dl><dt class="desktop-hint">left-click</dt><dd class="desktop-hint">move the dog</dd><dt class="touch-hint">tap</dt><dd class="touch-hint">move the dog</dd><dt class="desktop-hint">right-click</dt><dd class="desktop-hint">drop feed</dd><dt class="touch-hint">hold</dt><dd class="touch-hint">drop feed</dd><dt>Q</dt><dd>bark</dd><dt>W</dt><dd>circle the flock</dd><dt>E</dt><dd>sprint</dd><dt>R</dt><dd>recall / release at cursor</dd><dt>space</dt><dd>hover to regrow grass</dd><dt>P</dt><dd>pause / resume</dd><dt>H / escape</dt><dd>menu / close &amp; cancel tools</dd></dl>
    </section>
    <div id="toast" class="sr-only" role="status" aria-live="polite"></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
